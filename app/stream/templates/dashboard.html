<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiTrack - Live Monitoring</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <h1>VigiTrack</h1>
            <span class="status-pill"><span class="status-dot"></span> System Online</span>
        </div>
        <nav>
            <a href="/" title="Landing Page">Home</a>
            <a href="/dashboard" class="active">Dashboard</a>
            <a href="/incidents">Incidents</a>
            <a href="/settings">Settings</a>
            <a href="/logout" class="nav-logout">Logout</a>
        </nav>
    </div>

    <div class="page">
        <div class="grid">
            <div class="panel">
                <div class="panel-header">
                    <span>{{ camera_name if camera_name else "Camera 01 — Surveillance Feed" }}</span>
                    <span class="live-badge"><span class="live-dot"></span> Live</span>
                </div>
                <div class="video-wrap">
                    <span class="rec-tag"><span class="rec-dot"></span> REC</span>
                    <span class="corner tl"></span>
                    <span class="corner tr"></span>
                    <span class="corner bl"></span>
                    <span class="corner br"></span>
                    <img class="video-frame" src="/video_feed" alt="Surveillance video feed">
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>Live Alert Feed</span>
                </div>
                <div class="alert-list" id="alerts">
                    <div class="empty-state">No alerts yet — monitoring...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function updateAlerts() {
            fetch('/api/alerts')
                .then(res => {
                    if (!res.ok) throw new Error('Network error');
                    return res.json();
                })
                .then(data => {
                    const alertsDiv = document.getElementById('alerts');
                    if (!data || data.length === 0) {
                        alertsDiv.innerHTML = '<div class="empty-state">No alerts yet — monitoring...</div>';
                    } else {
                        alertsDiv.innerHTML = data.map(a => `
                            <div class="alert-item">
                                <span class="alert-time">${escapeHtml(a.time || '')}</span>
                                <span class="alert-message">${escapeHtml(a.message || '')}</span>
                            </div>
                        `).join('');
                    }
                })
                .catch(err => {
                    console.warn('Alert polling warning:', err);
                });
        }

        updateAlerts();
        setInterval(updateAlerts, 1500);
    </script>
</body>
</html>
