<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VigiTrack - Incidents</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <h1>VigiTrack</h1>
            <span class="status-pill"><span class="status-dot"></span> System Online</span>
        </div>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/incidents" class="active">Incidents</a>
            <a href="/settings">Settings</a>
            <a href="/logout" class="nav-logout">Logout</a>
        </nav>
    </div>

    <div class="page">
        <div class="panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Incident Log & Event History</span>
                <div style="display: flex; gap: 10px;">
                    <button class="small-button" onclick="loadIncidents()">Refresh</button>
                    <button class="small-button danger" onclick="clearAll()">Clear All</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Object</th>
                        <th>Distance</th>
                        <th>Camera</th>
                        <th>Status</th>
                        <th>Detected At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="incident-rows">
                    <tr><td colspan="7" class="empty-state">Loading incidents...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(isoString) {
            if (!isoString) return 'N/A';
            const normalized = isoString.replace(' ', 'T');
            const d = new Date(normalized);
            if (isNaN(d.getTime())) return isoString;
            const datePart = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const timePart = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
            return `${datePart} · ${timePart}`;
        }

        function loadIncidents() {
            const rows = document.getElementById('incident-rows');
            fetch('/api/incidents')
                .then(res => {
                    if (!res.ok) throw new Error('Failed to fetch incidents');
                    return res.json();
                })
                .then(data => {
                    if (!data || data.length === 0) {
                        rows.innerHTML = '<tr><td colspan="7" class="empty-state">No incidents recorded yet.</td></tr>';
                        return;
                    }
                    rows.innerHTML = data.map(i => {
                        const distText = (i.distance != null && !isNaN(i.distance))
                            ? `${Math.round(i.distance)}px`
                            : 'N/A';
                        return `
                            <tr>
                                <td class="mono">#${escapeHtml(i.id)}</td>
                                <td><span class="badge-object">${escapeHtml(i.object_class)}</span></td>
                                <td class="mono">${escapeHtml(distText)}</td>
                                <td>${escapeHtml(i.camera_name || 'Camera 01')}</td>
                                <td><span class="status-tag unattended">${escapeHtml(i.status || 'unattended')}</span></td>
                                <td class="mono">${escapeHtml(formatTime(i.detected_at))}</td>
                                <td>
                                    <button class="delete-btn" onclick="deleteItem(${i.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                })
                .catch(err => {
                    console.error(err);
                    rows.innerHTML = '<tr><td colspan="7" class="empty-state" style="color: #e06c75;">Error loading incidents. Please try refreshing.</td></tr>';
                });
        }

        function deleteItem(id) {
            if (!confirm(`Delete incident record #${id}?`)) return;
            fetch(`/api/incidents/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => loadIncidents());
        }

        function clearAll() {
            if (!confirm('Are you sure you want to delete ALL incident records?')) return;
            fetch('/api/incidents/clear', { method: 'POST' })
                .then(res => res.json())
                .then(() => loadIncidents());
        }

        loadIncidents();
    </script>
</body>
</html>
